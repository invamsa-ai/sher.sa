<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع الوظائف - وظائف السعودية</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <img src="assets/images/saudi-logo.png" alt="شعار السعودية" onerror="this.style.display='none'">
            <h1>وظائف <span>السعودية</span></h1>
        </div>
        <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="jobs.html" class="active">الوظائف</a>
                <a href="favorites.html">المفضلة</a>
            <a href="index.html#categories">الأقسام</a>
            <!-- <a href="#features">المميزات</a>
            <a href="#contact">اتصل بنا</a> -->
        </nav>
        <div class="auth-buttons">
            <a href="https://t.me/inanasukovich_123" class="btn-register"> أشترك بقناتنا</a>
        </div>
        <button class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<!-- قسم البحث والتصفية -->
<section class="jobs-filter-section">
    <div class="container">
        <div class="filter-header">
            <br>
            <br>
            <br>
            <br>
            <h2><i class="fas fa-search"></i> البحث عن وظائف</h2>
            <p>ابحثي عن الوظيفة المناسبة لكِ من بين آلاف الفرص</p>
        </div>
        
        <div class="filter-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="ابحث عن وظيفة... (مثال: محاسبة، موارد بشرية)">
                <button id="searchBtn"><i class="fas fa-search"></i> بحث</button>
            </div>
            
            <div class="filter-options">
                <div class="filter-group">
                    <label><i class="fas fa-layer-group"></i> المجال</label>
                    <select id="filterCategory">
                        <option value="all">جميع المجالات</option>
                        <option value="إدارية">إدارية</option>
                        <option value="مالية">مالية</option>
                        <option value="مبيعات">مبيعات</option>
                        <option value="تقنية">تقنية</option>
                        <option value="تسويق">تسويق</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label><i class="fas fa-graduation-cap"></i> المؤهل</label>
                    <select id="filterQualification">
                        <option value="all">جميع المؤهلات</option>
                        <option value="ثانوية">ثانوية</option>
                        <option value="دبلوم">دبلوم</option>
                        <option value="بكالوريوس">بكالوريوس</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label><i class="fas fa-briefcase"></i> نوع الدوام</label>
                    <select id="filterType">
                        <option value="all">جميع الأنواع</option>
                        <option value="عن بعد">عن بعد</option>
                        <option value="دوام جزئي">دوام جزئي</option>
                    </select>
                </div>
                
                <button id="resetFilters" class="btn-reset">
                    <i class="fas fa-undo-alt"></i> إعادة تعيين
                </button>
            </div>
        </div>
    </div>
</section>

<!-- عرض عدد النتائج -->
<section class="results-info">
    <div class="container">
        <div class="results-header">
            <span id="resultsCount">6</span>
            <span>وظيفة متاحة</span>
        </div>
    </div>
</section>

<!-- قائمة الوظائف -->
<section class="jobs-section">
    <div class="container">
        <div id="jobs-container" class="jobs-grid">
            <!-- سيتم عرض الوظائف عن طريق JavaScript من main.js -->
        </div>
    </div>
</section>

<!-- نموذج الاشتراك في الإشعارات -->
<section class="notification-subscribe">
    <div class="container">
        <div class="subscribe-card">
            <div class="subscribe-icon">
                <i class="fas fa-bell"></i>
            </div>
            <div class="subscribe-content">
                <h3>📧 احصلي على إشعارات بالوظائف الجديدة</h3>
                <p>سجلي بريدك الإلكتروني ليصلك أحدث الوظائف النسائية عن بعد</p>
            </div>
            <div class="subscribe-form">
                <input type="email" id="subscribeEmail" placeholder="بريدك الإلكتروني">
                <button id="subscribeBtn"><i class="fas fa-envelope"></i> اشتراك</button>
            </div>
        </div>
    </div>
</section>

<script src="js/main.js"></script>

<style>
/* أنماط إضافية لصفحة الوظائف */

.jobs-filter-section {
    padding: 40px 0;
    background: #f5f5f5;
}

.filter-header {
    text-align: center;
    margin-bottom: 30px;
}

.filter-header h2 {
    color: #165B33;
    font-size: 28px;
    margin-bottom: 10px;
}

.filter-header p {
    color: #666;
}

.filter-container {
    max-width: 1000px;
    margin: 0 auto;
}

.search-bar {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.search-bar input {
    flex: 1;
    padding: 15px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 50px;
    font-size: 16px;
    font-family: 'Tajawal', sans-serif;
    transition: 0.3s;
}

.search-bar input:focus {
    outline: none;
    border-color: #C9A03D;
}

.search-bar button {
    background: #C9A03D;
    border: none;
    padding: 0 30px;
    border-radius: 50px;
    color: #165B33;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Tajawal', sans-serif;
}

.search-bar button:hover {
    background: #b88d2e;
    transform: scale(1.02);
}

.filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: flex-end;
}

.filter-group {
    flex: 1;
    min-width: 150px;
}

.filter-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    color: #666;
}

.filter-group select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}

.filter-group select:focus {
    outline: none;
    border-color: #C9A03D;
}

.btn-reset {
    background: #165B33;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Tajawal', sans-serif;
    font-weight: bold;
}

.btn-reset:hover {
    background: #0d3d21;
    transform: translateY(-2px);
}

.results-info {
    padding: 20px 0;
    background: white;
    border-bottom: 1px solid #eee;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.results-header span:first-child {
    font-size: 24px;
    font-weight: 800;
    color: #C9A03D;
}

.results-header span:last-child {
    color: #666;
}

.jobs-section {
    padding: 40px 0;
    min-height: 400px;
}

.jobs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 25px;
}

/* أنماط النتائج المصفاة */
#filteredJobs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 25px;
}

.no-results {
    text-align: center;
    padding: 60px;
    background: white;
    border-radius: 20px;
    grid-column: 1 / -1;
}

.no-results i {
    font-size: 48px;
    color: #C9A03D;
    margin-bottom: 15px;
}

.no-results p {
    color: #666;
    font-size: 18px;
}

/* نموذج الاشتراك */
.notification-subscribe {
    padding: 60px 0;
    background: linear-gradient(135deg, #165B33 0%, #0d3d21 100%);
}

.subscribe-card {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
}

.subscribe-icon i {
    font-size: 50px;
    color: #C9A03D;
}

.subscribe-content {
    flex: 1;
}

.subscribe-content h3 {
    color: white;
    margin-bottom: 8px;
}

.subscribe-content p {
    color: rgba(255,255,255,0.8);
    font-size: 14px;
}

.subscribe-form {
    display: flex;
    gap: 10px;
}

.subscribe-form input {
    padding: 12px 20px;
    border: none;
    border-radius: 50px;
    width: 250px;
    font-family: 'Tajawal', sans-serif;
}

.subscribe-form button {
    background: #C9A03D;
    border: none;
    padding: 12px 25px;
    border-radius: 50px;
    color: #165B33;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Tajawal', sans-serif;
}

.subscribe-form button:hover {
    background: #b88d2e;
    transform: scale(1.02);
}

/* Toast animation */
@keyframes slideIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* استجابة للجوال */
@media (max-width: 768px) {
    .filter-options {
        flex-direction: column;
    }
    
    .filter-group {
        width: 100%;
    }
    
    .btn-reset {
        width: 100%;
    }
    
    .search-bar {
        flex-direction: column;
    }
    
    .jobs-grid {
        grid-template-columns: 1fr;
    }
    
    #filteredJobs {
        grid-template-columns: 1fr;
    }
    
    .results-header {
        flex-direction: column;
        text-align: center;
    }
    
    .subscribe-card {
        flex-direction: column;
        text-align: center;
    }
    
    .subscribe-form {
        flex-direction: column;
        width: 100%;
    }
    
    .subscribe-form input,
    .subscribe-form button {
        width: 100%;
    }
}
</style>

</body>
</html>
